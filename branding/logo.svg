<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FrameGuard">
  <title>FrameGuard</title>
  <!-- Outer frame -->
  <rect x="14" y="14" width="100" height="100" rx="10" fill="none" stroke="#1A3A3A" stroke-width="8"/>
  <!-- Timing ticks (top) -->
  <line x1="36" y1="14" x2="36" y2="28" stroke="#1A3A3A" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="14" x2="64" y2="32" stroke="#C45C26" stroke-width="5" stroke-linecap="round"/>
  <line x1="92" y1="14" x2="92" y2="28" stroke="#1A3A3A" stroke-width="5" stroke-linecap="round"/>
  <!-- Inner guard bar -->
  <rect x="34" y="52" width="60" height="14" rx="3" fill="#2F6F4E"/>
  <rect x="34" y="74" width="40" height="10" rx="2" fill="#2F4F4F" opacity="0.85"/>
</svg>
