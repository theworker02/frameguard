<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FrameGuard">
  <title>FrameGuard</title>
  <defs>
    <clipPath id="fg-screen">
      <rect x="28" y="34" width="72" height="60" rx="3"/>
    </clipPath>
  </defs>

  <!-- Outer chassis -->
  <rect x="14" y="14" width="100" height="100" rx="15" fill="#1A3A3A"/>
  <!-- Inner bezel -->
  <rect x="20" y="20" width="88" height="88" rx="11" fill="#2F4F4F"/>
  <!-- Screen well -->
  <rect x="28" y="34" width="72" height="60" rx="3" fill="#F4F6F5"/>

  <!-- Corner registration brackets -->
  <g fill="none" stroke="#1A3A3A" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M8 30 V8 H30"/>
    <path d="M120 30 V8 H98"/>
    <path d="M8 98 V120 H30"/>
    <path d="M120 98 V120 H98"/>
  </g>

  <!-- Top timing ruler (on upper bezel) -->
  <g stroke-linecap="round">
    <line x1="32" y1="27" x2="96" y2="27" stroke="#F4F6F5" stroke-width="1.5" opacity="0.32"/>
    <g stroke="#F4F6F5" stroke-width="1.2" opacity="0.5">
      <line x1="36" y1="24.8" x2="36" y2="29.2"/>
      <line x1="44" y1="25.4" x2="44" y2="28.6"/>
      <line x1="52" y1="24.8" x2="52" y2="29.2"/>
      <line x1="60" y1="25.4" x2="60" y2="28.6"/>
      <line x1="76" y1="25.4" x2="76" y2="28.6"/>
      <line x1="84" y1="24.8" x2="84" y2="29.2"/>
      <line x1="92" y1="25.4" x2="92" y2="28.6"/>
    </g>
    <g stroke="#F4F6F5" stroke-width="1.65" opacity="0.88">
      <line x1="36" y1="23.6" x2="36" y2="30.4"/>
      <line x1="52" y1="23.6" x2="52" y2="30.4"/>
      <line x1="84" y1="23.6" x2="84" y2="30.4"/>
    </g>
    <!-- signal tick aligned to jank bar center -->
    <line x1="66.1" y1="21.5" x2="66.1" y2="32.5" stroke="#C45C26" stroke-width="2.8"/>
  </g>

  <!-- Interior: frame-duration histogram + budget guard -->
  <g clip-path="url(#fg-screen)">
    <rect x="28" y="56" width="72" height="38" fill="#2F6F4E" opacity="0.08"/>
    <g stroke="#1A3A3A" stroke-width="0.75" opacity="0.07">
      <line x1="28" y1="48" x2="100" y2="48"/>
      <line x1="28" y1="72" x2="100" y2="72"/>
    </g>
    <line x1="30" y1="88" x2="98" y2="88" stroke="#1A3A3A" stroke-width="1.3" opacity="0.3"/>

    <!-- budget / guard threshold -->
    <line x1="30" y1="56" x2="97" y2="56" stroke="#2F6F4E" stroke-width="2" stroke-dasharray="3.25 2.25"/>
    <circle cx="30.5" cy="56" r="2.35" fill="#2F6F4E"/>
    <path d="M95.5 53.4 L98.5 56 L95.5 58.6" fill="none" stroke="#2F6F4E" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Frame bars (slate body + stone tip = build/raster); one signal spike -->
    <g>
      <rect x="33" y="66" width="5" height="22" rx="1.15" fill="#2F4F4F"/>
      <rect x="33" y="66" width="5" height="5.5" rx="1.15" fill="#5C6B6B"/>
      <rect x="40.5" y="72" width="5" height="16" rx="1.15" fill="#2F4F4F"/>
      <rect x="40.5" y="72" width="5" height="4" rx="1.15" fill="#5C6B6B"/>
      <rect x="48" y="62" width="5" height="26" rx="1.15" fill="#2F4F4F"/>
      <rect x="48" y="62" width="5" height="6.5" rx="1.15" fill="#5C6B6B"/>
      <rect x="55.5" y="68" width="5" height="20" rx="1.15" fill="#2F4F4F"/>
      <rect x="55.5" y="68" width="5" height="5" rx="1.15" fill="#5C6B6B"/>
      <!-- jank -->
      <rect x="63" y="38" width="6.2" height="50" rx="1.35" fill="#C45C26"/>
      <rect x="71.5" y="70" width="5" height="18" rx="1.15" fill="#2F4F4F"/>
      <rect x="71.5" y="70" width="5" height="4.5" rx="1.15" fill="#5C6B6B"/>
      <rect x="79" y="64" width="5" height="24" rx="1.15" fill="#2F4F4F"/>
      <rect x="79" y="64" width="5" height="6" rx="1.15" fill="#5C6B6B"/>
      <rect x="86.5" y="74" width="5" height="14" rx="1.15" fill="#2F4F4F"/>
      <rect x="86.5" y="74" width="5" height="3.5" rx="1.15" fill="#5C6B6B"/>
    </g>
  </g>

  <rect x="28" y="34" width="72" height="60" rx="3" fill="none" stroke="#1A3A3A" stroke-width="1.4" opacity="0.28"/>

  <!-- Shield / guard badge -->
  <g transform="translate(86, 88)">
    <path d="M2 3 C2 3 12 -1.5 22 3 L22 14.2 C22 20.5 12 25.5 12 25.5 C12 25.5 2 20.5 2 14.2 Z"
          fill="#2F6F4E" stroke="#F4F6F5" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M7.4 13.2 L10.8 16.6 L17 9.2" fill="none" stroke="#F4F6F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
