<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FrameGuard">
  <title>FrameGuard</title>
  <defs>
    <clipPath id="inner">
      <rect x="26" y="30" width="76" height="68" rx="4"/>
    </clipPath>
  </defs>

  <!-- Outer chassis (device / viewport frame) -->
  <rect x="12" y="12" width="104" height="104" rx="14" fill="none" stroke="#1A3A3A" stroke-width="5.5"/>
  <!-- Inner bezel -->
  <rect x="22" y="26" width="84" height="76" rx="6" fill="none" stroke="#1A3A3A" stroke-width="2.25" opacity="0.92"/>

  <!-- Corner brackets (technical precision) -->
  <g fill="none" stroke="#1A3A3A" stroke-width="2.5" stroke-linecap="square">
    <path d="M18 34 V22 H30"/>
    <path d="M110 34 V22 H98"/>
    <path d="M18 94 V106 H30"/>
    <path d="M110 94 V106 H98"/>
  </g>

  <!-- Frame-timing ruler along top bezel -->
  <g stroke="#1A3A3A" stroke-linecap="round">
    <!-- rail -->
    <line x1="30" y1="20" x2="98" y2="20" stroke-width="1.75" opacity="0.55"/>
    <!-- minor ticks -->
    <line x1="34" y1="17" x2="34" y2="23" stroke-width="1.4"/>
    <line x1="42" y1="18" x2="42" y2="22" stroke-width="1.2" opacity="0.7"/>
    <line x1="50" y1="17" x2="50" y2="23" stroke-width="1.4"/>
    <line x1="58" y1="18" x2="58" y2="22" stroke-width="1.2" opacity="0.7"/>
    <!-- signal / jank major tick -->
    <line x1="66" y1="14.5" x2="66" y2="25.5" stroke="#C45C26" stroke-width="2.75"/>
    <line x1="74" y1="18" x2="74" y2="22" stroke-width="1.2" opacity="0.7"/>
    <line x1="82" y1="17" x2="82" y2="23" stroke-width="1.4"/>
    <line x1="90" y1="18" x2="90" y2="22" stroke-width="1.2" opacity="0.7"/>
    <line x1="98" y1="17" x2="98" y2="23" stroke-width="1.4"/>
  </g>

  <!-- Interior: consecutive frame-duration bars + budget guard -->
  <g clip-path="url(#inner)">
    <!-- soft paper well -->
    <rect x="26" y="30" width="76" height="68" rx="4" fill="#F4F6F5"/>

    <!-- budget threshold (guard line) -->
    <line x1="28" y1="58" x2="100" y2="58" stroke="#2F6F4E" stroke-width="2" stroke-dasharray="3.5 2.5" opacity="0.95"/>
    <circle cx="30.5" cy="58" r="2.2" fill="#2F6F4E"/>

    <!-- frame bars (build / raster metaphor): healthy under budget, one jank spike -->
    <g stroke-linecap="round">
      <rect x="32" y="64" width="6" height="26" rx="1.5" fill="#2F4F4F"/>
      <rect x="41" y="70" width="6" height="20" rx="1.5" fill="#5C6B6B"/>
      <rect x="50" y="61" width="6" height="29" rx="1.5" fill="#2F4F4F"/>
      <rect x="59" y="67" width="6" height="23" rx="1.5" fill="#5C6B6B"/>
      <!-- jank frame piercing the budget -->
      <rect x="68" y="36" width="7" height="54" rx="1.75" fill="#C45C26"/>
      <rect x="78" y="66" width="6" height="24" rx="1.5" fill="#2F4F4F"/>
      <rect x="87" y="72" width="6" height="18" rx="1.5" fill="#5C6B6B"/>
    </g>

    <!-- pass band under budget (subtle) -->
    <rect x="28" y="59" width="70" height="1.5" fill="#2F6F4E" opacity="0.22"/>
  </g>

  <!-- Shield / guard badge (bottom-right of bezel) -->
  <g transform="translate(86, 88)">
    <path d="M0 2.5 C0 2.5 8 -2 16 2.5 L16 12.5 C16 18 8 22 8 22 C8 22 0 18 0 12.5 Z"
          fill="#2F6F4E" stroke="#1A3A3A" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- check -->
    <path d="M4.2 11.2 L7.1 14.2 L12.2 7.8" fill="none" stroke="#F4F6F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
