<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FrameGuard">
  <title>FrameGuard</title>
  <rect width="32" height="32" rx="7" fill="#F4F6F5"/>
  <!-- outer frame -->
  <rect x="3.5" y="3.5" width="25" height="25" rx="5" fill="none" stroke="#1A3A3A" stroke-width="2.25"/>
  <!-- timing ticks -->
  <line x1="10" y1="3.5" x2="10" y2="7.5" stroke="#1A3A3A" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="2.5" x2="16" y2="8.5" stroke="#C45C26" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="3.5" x2="22" y2="7.5" stroke="#1A3A3A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- mini bars -->
  <rect x="8" y="16" width="3" height="8" rx="0.8" fill="#2F4F4F"/>
  <rect x="12.5" y="18" width="3" height="6" rx="0.8" fill="#5C6B6B"/>
  <rect x="17" y="11" width="3.2" height="13" rx="0.8" fill="#C45C26"/>
  <rect x="21.5" y="17" width="3" height="7" rx="0.8" fill="#2F4F4F"/>
  <!-- budget line -->
  <line x1="7.5" y1="15" x2="25" y2="15" stroke="#2F6F4E" stroke-width="1.4"/>
</svg>
