name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version sync check
        run: dart run tool/sync_version.dart --check
      - name: Pub get
        run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit & widget tests
        run: flutter test
      - name: CLI smoke (fixtures)
        run: |
          dart run bin/frameguard.dart version
          dart run bin/frameguard.dart doctor
          dart run bin/frameguard.dart check test/fixtures/healthy_scroll.json
          dart run bin/frameguard.dart check test/fixtures/healthy_scroll.json --require-profile --profile mid_range
          dart run bin/frameguard.dart suggest-budget test/fixtures/healthy_scroll.json --format json
          dart run bin/frameguard.dart export test/fixtures/catalog_scroll.json --format markdown --out /tmp/fg.md
      - name: Overhead benchmarks
        run: flutter test benchmark/overhead_benchmark.dart
      - name: Package dry-run
        run: flutter pub publish --dry-run

  example:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Example pub get
        working-directory: example
        run: flutter pub get
      - name: Example analyze
        working-directory: example
        run: flutter analyze
